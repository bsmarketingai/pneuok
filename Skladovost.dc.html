<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
</helmet>
<div ref="{{ rootRef }}" onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position: relative; display: {{ display }}; max-width: 100%;">
  <sc-if value="{{ isGrid }}" hint-placeholder-val="{{ false }}">
    <span class="{{ labelClass }}" onClick="{{ toggle }}" style="cursor: pointer;">{{ label }}</span>
  </sc-if>
  <sc-if value="{{ isRow }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ toggle }}" style="display: flex; flex-direction: {{ rowDir }}; align-items: {{ rowAlign }}; column-gap: 64px; row-gap: 2px; font-family: Poppins, sans-serif; font-size: 16px; line-height: 1.35; color: #33e82f; cursor: pointer;">
      <div style="display: flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap;">
        <img src="https://www.pneuok.cz/configuration/1325-pneuok/css/img/availability_icon_green.svg" alt="" style="width: 22px; height: 22px; flex-shrink: 0;">
        <span>{{ label }}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px;">
        <span style="margin-right: 10px; white-space: nowrap;">další dostupnosti:</span>
        <sc-for list="{{ others }}" as="o" hint-placeholder-count="3">
          <span style="display: flex; align-items: baseline; gap: 10px; white-space: nowrap;">
            <span>{{ o.qty }}</span>
            <sc-if value="{{ o.sep }}"><span style="color: #ccd3dc; font-size: 14px;">|</span></sc-if>
          </span>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Skladovost" style="position: absolute; left: {{ popLeft }}; top: 100%; z-index: 1000; padding-top: 6px; width: {{ popWidth }}; box-sizing: border-box; cursor: default;">
      <div style="position: relative; background: #0a2852; border-radius: 12px; padding: 20px 20px 18px 20px; box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px 0px; color: #ffffff; font-family: Poppins, sans-serif; text-align: left;">
        <button type="button" aria-label="Zavřít" onClick="{{ close }}" style="position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;" style-hover="opacity: 0.75;">
          <span style="position: absolute; width: 26px; height: 2px; border-radius: 1px; background: #ffffff; transform: rotate(45deg);"></span>
          <span style="position: absolute; width: 26px; height: 2px; border-radius: 1px; background: #ffffff; transform: rotate(-45deg);"></span>
        </button>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 10px; padding: {{ r.pad }}; border-top: {{ r.border }};">
            <div style="display: flex; align-items: center; flex-wrap: wrap; column-gap: 24px; row-gap: 6px; padding-right: 44px;">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; line-height: 1.3; color: #33e82f;">
                <img src="https://www.pneuok.cz/configuration/1325-pneuok/css/img/availability_icon_green.svg" alt="" style="width: 22px; height: 22px; flex-shrink: 0;">
                <span>{{ r.name }}</span>
              </span>
              <span style="padding: 4px 12px; border-radius: 5px; background: #164b4c; color: #33e82f; font-size: 16px; font-weight: 600; line-height: 1.4; white-space: nowrap;">{{ r.qtyLabel }}</span>
            </div>
            <div style="font-size: 13px; line-height: 1.45; color: #ffffff; text-wrap: pretty;">{{ r.note }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;520px&quot;,&quot;height&quot;:&quot;360px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;row&quot;,&quot;grid&quot;],&quot;default&quot;:&quot;row&quot;,&quot;tsType&quot;:&quot;'row' | 'grid'&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Skladem &gt; 20 ks&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wrap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string, qty:string, note:string}[]&quot;}}">
class Component extends DCLogic {
  state = { open: false, popLeft: 0 };
  rootRef = React.createRef();
  componentWillUnmount() { clearTimeout(this._t); }
  place() {
    const el = this.rootRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const w = Math.min(450, window.innerWidth - 24);
    const over = r.left + w - (window.innerWidth - 12);
    this.setState({ popLeft: over > 0 ? -Math.min(over, r.left - 12) : 0 });
  }
  show() { clearTimeout(this._t); if (!this.state.open) { this.place(); this.setState({ open: true }); } }
  hide(delay) { clearTimeout(this._t); this._t = setTimeout(() => this.setState({ open: false }), delay); }
  renderVals() {
    const p = this.props;
    const variant = p.variant || 'row';
    const label = p.label || 'Skladem > 20 ks';
    const mainQty = label.replace(/^Skladem\s*(dodavatel\s*(CZ|EU)\s*)?/i, '').replace(/\s*ks$/i, '');
    const note = 'při objednávce do 14:00 hodin, osobní odběr po potvrzení';
    const euNote = 'obvyklé dodání od 5 do 10 prac. dní, osobní odběr po potvrzení';
    const src = p.rows || (/dodavatel\s*CZ/i.test(label) ? [
      { name: 'Skladem dodavatel CZ', qty: mainQty, note },
      { name: 'Skladem dodavatel EU', qty: '> 20', note: euNote }
    ] : /dodavatel\s*EU/i.test(label) ? [
      { name: 'Skladem dodavatel EU', qty: mainQty, note: euNote }
    ] : null) || [
      { name: 'Skladem', qty: mainQty, note },
      { name: 'Skladem dodavatel CZ', qty: '> 20', note },
      { name: 'Skladem dodavatel EU', qty: '20', note: 'obvyklé dodání od 5 do 10 prac. dní, osobní odběr po potvrzení' }
    ];
    const n = src.length;
    const rows = src.map((r, i) => ({
      ...r, qtyLabel: r.qty + ' ks',
      border: i ? '1px solid rgba(255, 255, 255, 0.22)' : '0',
      pad: n === 1 ? '0' : i === 0 ? '0 0 14px 0' : i === n - 1 ? '14px 0 0 0' : '14px 0'
    }));
    const wrap = !!p.wrap;
    return {
      rootRef: this.rootRef,
      isGrid: variant === 'grid', isRow: variant !== 'grid',
      display: variant === 'grid' ? 'inline-block' : 'block',
      label,
      labelClass: 'label custom_avail_' + (p.tone || 'green'),
      others: src.map((r, i) => ({ qty: r.qty, sep: i < n - 1 })),
      rowDir: wrap ? 'column' : 'row', rowAlign: wrap ? 'flex-start' : 'center',
      rows,
      open: !!p.forceOpen || this.state.open,
      popLeft: this.state.popLeft + 'px',
      popWidth: 'min(450px, calc(100vw - 24px))',
      enter: () => this.show(),
      leave: () => this.hide(160),
      toggle: () => (this.state.open ? this.hide(0) : this.show()),
      close: e => { e.stopPropagation(); this.hide(0); }
    };
  }
}
</script>
</body>
</html>
